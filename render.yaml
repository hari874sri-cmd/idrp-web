
services:
  # Django backend
  - type: web
    name: reroute-ai-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python manage.py migrate --noinput && gunicorn config.wsgi:application --log-file -
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "reroute-ai-backend.onrender.com"
      - key: AI_PROVIDER
        value: "demo"
      - key: DB_ENGINE
        value: "sqlite"

  # Vite frontend
  - type: web
    name: reroute-ai-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://reroute-ai-backend.onrender.com/api/v1
