
services:
  # Django backend
  - type: web
    name: reroute-ai-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: |
      pip install -r backend/requirements.txt
      python backend/manage.py migrate --noinput
      python backend/manage.py collectstatic --noinput
    startCommand: cd backend && gunicorn config.wsgi:application --log-file -
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "reroute-ai-backend.onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "true"
      - key: DB_ENGINE
        value: "postgresql"
      - key: AI_PROVIDER
        value: "demo"
      - key: PYTHON_VERSION
        value: "3.12.0"

  # Vite frontend
  - type: web
    name: reroute-ai-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://reroute-ai-backend.onrender.com/api/v1
